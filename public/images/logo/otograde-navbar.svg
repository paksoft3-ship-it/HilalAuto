<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 52" width="260" height="52" role="img" aria-label="Otograde">
  <title>Otograde</title>

  <!-- Wordmark: Oto bold black + grade thin red -->
  <text
    x="0" y="36"
    font-family="'Inter','Helvetica Neue',Arial,sans-serif"
    font-size="38"
    font-weight="800"
    fill="#0D0D0D"
    letter-spacing="-1"
  >Oto</text>
  <text
    x="92" y="36"
    font-family="'Inter','Helvetica Neue',Arial,sans-serif"
    font-size="38"
    font-weight="300"
    fill="#C0392B"
    letter-spacing="-0.5"
  >grade</text>

  <!-- Slim grade bar — no letters, just color strip -->
  <rect x="0"   y="44" width="36" height="3" rx="1.5" fill="#27AE60"/>
  <rect x="42"  y="44" width="36" height="3" rx="1.5" fill="#E67E22"/>
  <rect x="84"  y="44" width="36" height="3" rx="1.5" fill="#C0392B"/>
  <rect x="126" y="44" width="36" height="3" rx="1.5" fill="#D5D5D5"/>
  <rect x="168" y="44" width="36" height="3" rx="1.5" fill="#E8E8E8"/>
</svg>
